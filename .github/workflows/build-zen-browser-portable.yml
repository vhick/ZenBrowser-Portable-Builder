name: Build Zen Browser Portable ZIP (Manual)

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Official stable tag, e.g. 1.23.3b'
        required: true
        default: '1.23.3b'
        type: string
      architecture:
        description: 'Your Windows architecture'
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64

permissions:
  contents: read

jobs:
  portable-zip:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - name: Checkout your portable builder
        uses: actions/checkout@v4
      - name: Set up Python for icon extraction and checks
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install builder dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install "icoextract>=0.2,<1" "Pillow>=10,<13" "pytest>=8,<10"
          if ($LASTEXITCODE -ne 0) { throw 'Python dependencies failed' }
      - name: Run offline builder tests
        shell: pwsh
        run: |
          python -m pytest tests -q
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed, not building package' }
      - name: Download official Zen release and build portable ZIP
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
          TARGET_ARCH: ${{ inputs.architecture }}
        run: |
          & ./builder/build_windows.ps1 -Version $env:RELEASE_VERSION -Architecture $env:TARGET_ARCH
          if ($LASTEXITCODE -ne 0) { throw 'Zen portable build failed' }
      - name: Upload only the clean portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: ZenBrowser-Portable-${{ inputs.release_version }}-${{ inputs.architecture }}
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 7
